<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A Life — motif preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Newsreader:opsz,wght@6..72,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #16110d;
      --ink: #ece1cf;
      --amber: #e0a94b;
      --panel: rgba(236, 225, 207, 0.055);
      --line: rgba(236, 225, 207, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: "Newsreader", Georgia, serif;
    }

    main {
      width: min(1040px, calc(100% - 40px));
      margin: 0 auto;
      padding: 48px 0 56px;
    }

    h1 {
      margin: 0 0 28px;
      color: var(--ink);
      font-family: "Fraunces", Georgia, serif;
      font-size: clamp(2rem, 5vw, 4.15rem);
      font-weight: 500;
      letter-spacing: 0;
      line-height: 1.02;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 18px;
    }

    .card {
      display: grid;
      gap: 12px;
      justify-items: center;
      padding: 22px 18px 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }

    .motif {
      display: grid;
      place-items: center;
      width: 150px;
      height: 150px;
    }

    .motif svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .key {
      color: var(--amber);
      font-family: "Fraunces", Georgia, serif;
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0;
    }
  </style>
</head>
<body>
  <main>
    <h1>A Life — motif preview</h1>
    <div class="grid" id="motif-grid" aria-label="Motif preview gallery"></div>
  </main>

  <script src="motifs.js"></script>
  <script>
    const grid = document.getElementById('motif-grid');

    Object.entries(MOTIFS).forEach(([key, svg]) => {
      const card = document.createElement('article');
      card.className = 'card';

      const motif = document.createElement('div');
      motif.className = 'motif';
      motif.innerHTML = svg;

      const label = document.createElement('div');
      label.className = 'key';
      label.textContent = key;

      card.append(motif, label);
      grid.append(card);
    });
  </script>
</body>
</html>
